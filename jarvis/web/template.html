<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Resolução Jarvis</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    MathJax = {
        tex: {
            inlineMath: [['\\(', '\\)'], ['$', '$']],
            displayMath: [['\\[', '\\]'], ['$$', '$$']],
            processEscapes: true,
            processEnvironments: true
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
        },
        svg: { fontCache: 'global' }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; margin: 0; padding: 20px; font-size: 18px; }
        .container { max-width: 900px; margin: 0 auto; background-color: #252526; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; background-color: #1e1e1e; }
        th, td { border: 1px solid #444; padding: 12px; text-align: left; }
        th { background-color: #333; }
        .btn-imprimir { background-color: #007acc; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; float: right; font-size: 16px; margin-bottom: 20px; font-weight: bold; transition: 0.3s; }
        .btn-imprimir:hover { background-color: #005f9e; }
        h2 { color: #569cd6; border-bottom: 1px solid #444; padding-bottom: 10px; }
        mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-imprimir" onclick="window.print()">🖨️ Salvar em PDF</button>
        <h2>Resolução Jarvis</h2>
        <div id="content"></div>
    </div>
    <script>
        const rawText = `{{TEXTO_SEGURO}}`;
        document.getElementById('content').innerHTML = marked.parse(rawText);
    </script>
</body>
</html>
